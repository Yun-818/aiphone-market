name: rebuild-market-index

on:
  push:
    paths:
      - 'packs/**'
      - 'scripts/build-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild index.json
        run: node scripts/build-index.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json 无变化"
            exit 0
          fi
          git config user.name  "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add index.json
          git commit -m "chore: rebuild index.json"
          git push
